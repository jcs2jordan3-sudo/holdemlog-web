<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>HoldemLog — 비밀번호 재설정</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: #0d1117; color: #e6edf3;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      text-align: center; padding: 24px; box-sizing: border-box;
    }
    .card {
      background: #161b22; border: 1px solid #21262d; border-radius: 16px;
      padding: 36px 28px; max-width: 360px; width: 100%; box-sizing: border-box;
    }
    h1 { font-size: 20px; margin: 0 0 10px; color: #3fdc81; }
    p { font-size: 14.5px; line-height: 1.6; color: #9da7b3; margin: 0 0 18px; }
    input {
      width: 100%; box-sizing: border-box; padding: 14px; margin-bottom: 10px;
      font-size: 16px; color: #e6edf3; background: #0d1117;
      border: 1px solid #30363d; border-radius: 10px;
    }
    input:focus { outline: none; border-color: #3fdc81; }
    button {
      width: 100%; padding: 15px; font-size: 16px; font-weight: 800;
      color: #003912; background: #3fe56c; border: 0; border-radius: 10px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    .msg { min-height: 22px; font-size: 14px; margin: 12px 0 0; }
    .err { color: #ff8a80; }
    .ok { color: #3fdc81; }
    .brand { margin-top: 24px; font-size: 12px; color: #57606a; font-weight: 700; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">비밀번호 재설정</h1>
    <p id="lead">새로 쓸 비밀번호를 정해 주세요. (8자 이상)</p>

    <form id="form" class="hidden">
      <input id="pw" type="password" autocomplete="new-password"
             placeholder="새 비밀번호" minlength="8" required>
      <input id="pw2" type="password" autocomplete="new-password"
             placeholder="새 비밀번호 확인" minlength="8" required>
      <button id="submit" type="submit">비밀번호 바꾸기</button>
    </form>

    <div id="msg" class="msg"></div>
    <div class="brand">HOLDEM LOG</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script>
    // 앱이 보낸 재설정 메일의 링크가 여는 페이지. 링크(#access_token=…&type=recovery)를
    // supabase-js가 읽어 복구 세션을 만들고, 여기서 새 비밀번호로 updateUser를 부른다.
    // 공개(publishable) 키만 쓴다 — 앱에 들어 있는 것과 같은 키.
    const client = supabase.createClient(
      'https://cwboyqcgqqcuigowrovm.supabase.co',
      'sb_publishable_JVPQ34TGM4rYje2GmX0vwg_xmnEH0G-'
    );

    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const lead = document.getElementById('lead');
    const button = document.getElementById('submit');

    function show(text, kind) {
      msg.textContent = text;
      msg.className = 'msg ' + (kind || '');
    }

    function expired() {
      lead.textContent = '';
      show('링크가 만료됐거나 이미 사용됐어요. 앱 로그인 화면에서 ' +
           '「비밀번호를 잊으셨나요?」를 다시 눌러 주세요.', 'err');
    }

    // 링크에 오류가 실려 오는 경우 (만료 등)
    if (location.hash.includes('error=')) {
      expired();
    } else {
      client.auth.getSession().then(({ data }) => {
        if (data.session) form.classList.remove('hidden');
        else expired();
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw.length < 8) return show('비밀번호는 8자 이상이어야 해요.', 'err');
      if (pw !== pw2) return show('두 비밀번호가 서로 달라요.', 'err');

      button.disabled = true;
      show('바꾸는 중…');
      const { error } = await client.auth.updateUser({ password: pw });
      if (error) {
        button.disabled = false;
        return show('바꾸지 못했어요: ' + error.message, 'err');
      }
      await client.auth.signOut();
      form.classList.add('hidden');
      lead.textContent = '';
      document.getElementById('title').textContent = '비밀번호를 바꿨어요';
      show('이 창을 닫고 HoldemLog 앱에서 새 비밀번호로 로그인해 주세요.', 'ok');
    });
  </script>
</body>
</html>

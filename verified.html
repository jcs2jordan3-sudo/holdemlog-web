<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoldemLog — 이메일 인증 완료</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: #0d1117; color: #e6edf3;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      text-align: center; padding: 24px; box-sizing: border-box;
    }
    .card {
      background: #161b22; border: 1px solid #21262d; border-radius: 16px;
      padding: 40px 28px; max-width: 360px;
    }
    .check {
      width: 64px; height: 64px; border-radius: 50%; background: #16a34a22;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; font-size: 32px;
    }
    h1 { font-size: 20px; margin: 0 0 10px; color: #3fdc81; }
    p { font-size: 14.5px; line-height: 1.6; color: #9da7b3; margin: 0; }
    .brand { margin-top: 24px; font-size: 12px; color: #57606a; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✅</div>
    <h1>이메일 인증 완료</h1>
    <p>인증이 끝났습니다.<br>
       이 창을 닫고 <b>HoldemLog 앱으로 돌아가</b><br>
       이메일과 비밀번호로 로그인해 주세요.</p>
    <div class="brand">HOLDEM LOG</div>
  </div>
</body>
</html>
